; ═══════════════════════════════════════════════════════════════════════
; Supervisor : gère les workers de queue Laravel en arrière-plan
; À placer dans /etc/supervisor/conf.d/fmfp-worker.conf
; Puis : sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start fmfp-worker:*
; ═══════════════════════════════════════════════════════════════════════

[program:fmfp-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/fmfp-dees/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/fmfp-worker.log
stopwaitsecs=3600
