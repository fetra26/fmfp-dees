; ═══════════════════════════════════════════════════════════════════════
; Configuration OPcache optimisée pour FMFP-DEES en production
; À copier dans /etc/php/8.2/mods-available/opcache.ini
; Puis redémarrer PHP-FPM : sudo systemctl restart php8.2-fpm
; ═══════════════════════════════════════════════════════════════════════

zend_extension=opcache

; ─── OPcache activé ───
opcache.enable=1
opcache.enable_cli=0

; ─── Mémoire allouée (256 Mo suffisent pour Filament) ───
opcache.memory_consumption=256

; ─── Buffer strings internes (accélère les hash de string) ───
opcache.interned_strings_buffer=16

; ─── Nombre max de fichiers cachés (Filament ~5000 fichiers) ───
opcache.max_accelerated_files=20000

; ─── Revalidation : en prod, on désactive et on vide manuellement au deploy ───
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; ─── Garder les commentaires (Filament utilise des annotations) ───
opcache.save_comments=1

; ─── Optimisations avancées ───
opcache.fast_shutdown=1
opcache.enable_file_override=1
opcache.optimization_level=0x7FFEBFFF

; ─── JIT (PHP 8+) : gain 10-20% supplémentaire sur code CPU-intensive ───
opcache.jit_buffer_size=100M
opcache.jit=1255

; ─── Preloading (à activer si vous voulez précharger Laravel au boot) ───
; opcache.preload=/var/www/fmfp-dees/preload.php
; opcache.preload_user=www-data
