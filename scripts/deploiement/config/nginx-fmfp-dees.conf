# ═══════════════════════════════════════════════════════════════════════
# Nginx server block pour FMFP-DEES
# À placer dans /etc/nginx/sites-available/fmfp-dees
# Puis activer : sudo ln -s /etc/nginx/sites-available/fmfp-dees /etc/nginx/sites-enabled/
# ═══════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;

    server_name fmfp-dees.local www.fmfp-dees.local _;

    root /var/www/fmfp-dees/public;
    index index.php;

    # ─── Sécurité : cacher les fichiers sensibles ───
    location ~ /\.(?!well-known).* { deny all; access_log off; log_not_found off; }
    location ~ /\.env { deny all; }
    location ~ /storage/logs { deny all; }

    # ─── Fichiers statiques : cache navigateur long ───
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    # ─── Charset + limites ───
    charset utf-8;
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # ─── Routes Laravel ───
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # ─── PHP-FPM ───
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # ─── Logs ───
    access_log /var/log/nginx/fmfp-dees-access.log;
    error_log  /var/log/nginx/fmfp-dees-error.log warn;

    # ─── Compression Gzip ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # ─── Headers sécurité (LAN interne, minimal mais utile) ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
}
